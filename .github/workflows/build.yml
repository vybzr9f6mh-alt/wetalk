name: 构建 WeTalk 安装包

# 用途：在 GitHub Actions 上产出 APK / IPA。
# 用法：把本文件内容覆盖到 .github/workflows/build.yml（需要 GitHub 的 workflow 权限）。
# 与旧版的区别：
#   1. 不再使用 android-actions/setup-android（新版 runner 上它会卡在已废弃的 "tools" 包）；
#   2. 构建产物直接发布到 Release，便于下载。

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "后端地址，如 https://wetalk.example.com；留空则 App 内手动填写"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 使用运行器预装的 Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "platforms:"; ls "$SDK/platforms" 2>/dev/null || true
          echo "build-tools:"; ls "$SDK/build-tools" 2>/dev/null || true

      - name: 接受许可并补齐平台
        run: |
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            if [ -z "$(ls "$ANDROID_HOME/platforms" 2>/dev/null | grep -E 'android-3[4-9]')" ]; then
              yes | "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
            fi
          fi

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 生成图标
        run: python3 tools/gen_icons.py public

      - name: 创建 Android 工程
        run: npx cap add android

      - name: 注入后端地址
        env:
          WETALK_SERVER_URL: ${{ inputs.server_url }}
        run: node tools/set-server.mjs

      - name: 同步 Web 资源
        run: npx cap sync android

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "../WeTalk-${{ github.run_number }}.apk"
          ls -lh "../WeTalk-${{ github.run_number }}.apk"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wetalk-apk
          path: WeTalk-*.apk
          if-no-files-found: error

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: WeTalk Android 构建 ${{ github.run_number }}
          body: |
            Android 调试签名包，可直接侧载安装（需允许「安装未知来源应用」）。
          files: WeTalk-*.apk
          fail_on_unmatched_files: true
